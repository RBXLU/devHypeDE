[workspace]
resolver = "2"
members = [
    "crates/hype-anim",
    "crates/hype-theme",
    "crates/hype-config",
    "crates/hype-ipc",
    "crates/hypede-compositor",
    "crates/hypede-shell",
    "crates/hypede-files",
    "crates/hypede-settings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/RBXLU/devHypeDE"
authors = ["HypeDE contributors"]

[workspace.dependencies]
hype-anim = { path = "crates/hype-anim" }
hype-theme = { path = "crates/hype-theme" }
hype-config = { path = "crates/hype-config" }
hype-ipc = { path = "crates/hype-ipc" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
