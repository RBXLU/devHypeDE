[package]
name = "hypede-compositor"
description = "The HypeDE Wayland compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hypede-comp"
path = "src/main.rs"

[lib]
name = "hypede_compositor"
path = "src/lib.rs"

[dependencies]
hype-anim = { workspace = true }
hype-config = { workspace = true }
hype-ipc = { workspace = true }
hype-theme = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcursor = "0.3"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "renderer_multi",
    "wayland_frontend",
    "desktop",
]

[dependencies.smithay-drm-extras]
version = "0.1"
# Возможность display-info включена по умолчанию и тянет системную
# libdisplay-info, привязанную к версии ниже 0.3. В Arch и CachyOS стоит уже
# 0.3, и сборка на них ломается. Нам оттуда нужен только обход разъёмов
# видеокарты, поэтому разбор EDID отключён.
default-features = false
