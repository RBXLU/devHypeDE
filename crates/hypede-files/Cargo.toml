[package]
name = "hypede-files"
description = "HypeDE file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hype-files"
path = "src/main.rs"

[lib]
name = "hypede_files"
path = "src/lib.rs"

[dependencies]
hype-config = { workspace = true }
