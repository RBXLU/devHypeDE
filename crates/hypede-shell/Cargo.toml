[package]
name = "hypede-shell"
description = "HypeDE panel and shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hype-shell"
path = "src/main.rs"

[lib]
name = "hypede_shell"
path = "src/lib.rs"

[dependencies]
hype-config = { workspace = true }
hype-ipc = { workspace = true }
hype-theme = { workspace = true }
gtk4 = "0.9"
async-channel = "2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
